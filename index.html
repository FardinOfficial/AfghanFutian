<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#F4F3EF" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://afghanfutian.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Afghan Futian Trading Company" />
    <meta property="og:title" content="Afghan Futian Trading Company — Connecting Markets. Moving the World." />
    <meta
      property="og:description"
      content="Global sourcing, supply chain and logistics solutions connecting China with opportunities worldwide."
    />
    <meta property="og:url" content="https://afghanfutian.com/" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1590496793907-4d66e2994b4d?auto=format&fit=crop&w=1200&h=630&q=70" />
    <meta property="og:image:alt" content="Afghan Futian Trading Company — international sourcing and logistics" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Global sourcing, supply chain and logistics solutions connecting China with opportunities worldwide."
    />

    <!-- Typography: Space Grotesk (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only weights 400 and 500 are used anywhere in the interface. Asking for
         the full family would download several weights that are never rendered. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Photography is served from the Unsplash CDN. Warm up the connection early. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- One square 512x512 tile. The mark is 1.50:1, so it fills the tile's
         width and is centred vertically rather than stretched. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png" />

    <!--
      Structured data mirrors the official company record in
      `src/data/company.js`. Only confirmed details are published. There is no
      founding date, registration number, opening hours, rating or employee
      count because none has been supplied.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Afghan Futian Trading Company",
        "alternateName": "Afghan Futian",
        "url": "https://afghanfutian.com/",
        "description": "International sourcing, trading and supply chain company connecting China's supplier base with buyers worldwide.",
        "logo": "https://afghanfutian.com/favicon.png",
        "email": "contact@afghanfutian.com",
        "telephone": ["+86 147 5788 1420", "+93 70 513 2426"],
        "address": [
          {
            "@type": "PostalAddress",
            "streetAddress": "Yiwu",
            "addressLocality": "Yiwu",
            "addressRegion": "Zhejiang Province",
            "addressCountry": "CN"
          },
          {
            "@type": "PostalAddress",
            "streetAddress": "3rd Floor, Noor Plaza, Street 2, Qala-e-Fathullah",
            "addressLocality": "Kabul",
            "addressCountry": "AF"
          },
          {
            "@type": "PostalAddress",
            "streetAddress": "Sader Market, Mandawi",
            "addressLocality": "Kabul",
            "addressCountry": "AF"
          }
        ],
        "sameAs": [
          "https://www.facebook.com/share/19mRWeAZsQ/",
          "https://www.instagram.com/afghanfutian?hvrq=MXI1b2l3czg1YXI1bQ==",
          "https://www.tiktok.com/@afghan.futian.trading.co?_r=1&_t=ZS-9BXDz5gBOc5"
        ],
        "knowsAbout": [
          "Global sourcing",
          "International trade",
          "Supply chain coordination",
          "Logistics coordination"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      No-JavaScript fallback.

      The site is client-rendered, so with scripting disabled #root stays empty
      and the visitor would otherwise see nothing at all. The styles for this
      block live in src/styles/index.css — they are authored CSS, not generated
      utilities, because they must render from the stylesheet alone.

      The address below mirrors `COMPANY.email` in src/data/company.js. It is
      duplicated here because it must be readable before any application code
      runs. Update both together.
    -->
    <noscript>
      <div class="noscript">
        <div class="noscript__inner">
          <p class="u-eyebrow">JavaScript required</p>
          <h1 class="noscript__title">This site needs JavaScript to run.</h1>
          <p class="noscript__body">
            Navigation, imagery and the enquiry form are all driven by JavaScript. Please enable
            it, or reach us directly by email.
          </p>
          <p class="noscript__body">
            <a href="mailto:contact@afghanfutian.com">contact@afghanfutian.com</a>
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
